<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Study Planner</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--text:#1d2433;--muted:#6b7385;--accent:#4f6df5;--line:#e3e6ef;--ok:#2e9d62;--m:#f5a524;--a:#3b82f6;--e:#8b5cf6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1e29;--text:#e8ebf4;--muted:#98a0b5;--accent:#7f95ff;--line:#2b3140;--ok:#4cc88a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1e29;--text:#e8ebf4;--muted:#98a0b5;--accent:#7f95ff;--line:#2b3140;--ok:#4cc88a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:1250px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:1.5rem;margin:0}
.status{font-size:.85rem;color:var(--muted)}.status.ok{color:var(--ok)}
.coach{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--accent),#2fd0c4);color:#fff;border-radius:16px;padding:14px 18px;margin-bottom:14px}
.coach svg{width:160px;height:264px;flex:none}
.aura{animation:pulse 2.4s ease-in-out infinite;transform-origin:100px 170px}
@keyframes pulse{50%{transform:scale(1.07);opacity:.35}}
@media (prefers-reduced-motion:reduce){.aura{animation:none}}
.bubble{background:rgba(255,255,255,.95);color:#1d2433;border-radius:14px;padding:12px 14px;flex:1;position:relative}
.bubble small{display:block;color:#5a6378;font-weight:700;margin-bottom:2px}
.bubble p{margin:0 0 8px;font-size:1.05rem;font-weight:600}
.bubble button{border:0;background:#1d2433;color:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.top{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#2fd0c4);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.day h2{font-size:1.1rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.day h2 span{color:var(--muted);font-weight:500;font-size:.8rem;background:var(--bg);padding:2px 8px;border-radius:99px}
.sec{border-left:4px solid var(--c);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.sec h3{margin:0 0 4px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
li input{margin-top:3px;accent-color:var(--c);width:18px;height:18px;flex:none;cursor:pointer}
li label{flex:1;word-break:break-word;cursor:pointer}
li.done label{text-decoration:line-through;color:var(--muted)}
li button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1}li button:hover{color:#d33}
.add{display:flex;gap:6px;margin-top:4px}
.add input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:.9rem}
.add button,.reset{padding:6px 11px;border:0;border-radius:8px;background:var(--c,var(--accent));color:#fff;font:inherit;font-size:.9rem;cursor:pointer}
.reset{background:transparent;color:var(--muted);border:1px solid var(--line)}
@media(max-width:520px){.coach svg{width:104px;height:171px}}
.power{font-weight:800;font-size:.85rem;color:#4f6df5;margin:0 0 8px}
.focus{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.ftime{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.fbtns{display:flex;gap:8px;align-items:center}
.fbtns select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
#fstart{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:7px 16px;font:inherit;cursor:pointer;min-width:80px}
.subjects{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{border:2px solid var(--c);background:transparent;color:var(--c);border-radius:99px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--c);color:#fff}
.tag{font-size:.7rem;font-weight:700;color:#fff;border-radius:99px;padding:2px 8px;cursor:pointer;white-space:nowrap;margin-top:2px}
.tag.none{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:500}
#chatfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20}
#chat{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));height:min(460px,70vh);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;z-index:21}
#chat[hidden],#chatfab[hidden]{display:none}
#chat header{margin:0;padding:10px 14px;background:linear-gradient(135deg,var(--accent),#2fd0c4);color:#fff;font-weight:700}
#chat header button{border:0;background:none;color:#fff;font-size:1.3rem;cursor:pointer}
#chatlog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:.95rem}
.msg.bot{background:var(--bg);align-self:flex-start}
.msg.me{background:var(--accent);color:#fff;align-self:flex-end}
#chatq{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
#chatq button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;padding:3px 10px;font:inherit;font-size:.8rem;cursor:pointer}
#chatrow{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}
#chatin{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
#chatsend{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:0 14px;font:inherit;cursor:pointer}
.badges{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin-bottom:14px}
#badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--bg);cursor:pointer}
.badge.locked{opacity:.4;filter:grayscale(1)}
.tokens{font-weight:700;margin-right:4px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:8px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#toast.show{opacity:1}
#shop{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:min(340px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:22}
#shop[hidden]{display:none}
#shop header{display:flex;justify-content:space-between;align-items:center;margin:0;padding:10px 14px;background:linear-gradient(135deg,#f5a524,#ec4899);color:#fff;font-weight:700;position:sticky;top:0}
#shop header button{border:0;background:none;color:#fff;font-size:1.3rem;cursor:pointer}
#shop h4{margin:12px 14px 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.shopinfo{margin:8px 14px 0;font-size:.85rem;color:var(--muted)}
.item{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--line)}
.item .n{flex:1}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);flex:none}
.item button{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:5px 11px;font:inherit;font-size:.85rem;cursor:pointer}
.item button.on{background:var(--ok)}
.coach{position:relative}
#acc-mochi,.pet{position:absolute;right:20px;bottom:-16px;width:78px;height:68px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.pill{border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}
.pill.on{background:var(--accent);color:#fff}
#nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding:8px 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shopcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.prev{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.7rem}
.shopcard button{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:6px 14px;font:inherit;cursor:pointer}
.shopcard button.on{background:var(--ok)}
.goal{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.goal .pill{padding:0 12px}
.cols{display:flex;gap:8px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.bars{height:110px;width:100%;display:flex;gap:3px;align-items:flex-end}
.b1,.b2{flex:1;border-radius:4px 4px 0 0}
.b1{background:var(--line)}.b2{background:var(--accent)}
.strip{display:flex;gap:4px;margin-top:6px}
.sq{flex:1;height:22px;border-radius:5px;background:var(--line)}.sq.on{background:var(--ok)}
.boss{font-size:3rem}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;cursor:pointer;text-align:left}
.opt.good{border-color:var(--ok);background:rgba(46,157,98,.2)}
.opt.bad{border-color:#d33;background:rgba(221,51,51,.2)}
h1{background:linear-gradient(90deg,var(--accent),#2fd0c4);-webkit-background-clip:text;background-clip:text;color:transparent}
.day,.card,.shopcard{box-shadow:0 2px 12px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
.day:hover,.shopcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.16)}
button{transition:filter .15s,transform .1s}button:hover{filter:brightness(1.1)}button:active{transform:scale(.97)}
.coach{box-shadow:0 8px 24px rgba(79,109,245,.3)}
.notes{width:100%;min-height:260px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;resize:vertical}
.exform{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.exform input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.exrow{display:flex;gap:10px;align-items:center;padding:4px 0}.exrow .n{flex:1}
.urgent{color:#d33;font-weight:700}
.exrow .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px}
.mcard{aspect-ratio:1;border:2px solid var(--accent);border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:1.05rem;cursor:pointer}
.mcard.up{background:var(--card);color:var(--text)}
.mcard.ok{background:rgba(46,157,98,.25);border-color:var(--ok);color:var(--text)}
#away{display:none;align-items:center;gap:12px;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:12px 16px;margin-bottom:14px}
#away.show{display:flex}
#away b{display:block;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
#away span{flex:1}
#away button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.herosvg{width:160px;height:264px;flex:none;animation:bob 3s ease-in-out infinite}
body{background-image:radial-gradient(900px 400px at 8% -10%,color-mix(in srgb,var(--accent) 20%,transparent),transparent),radial-gradient(700px 400px at 100% 0,color-mix(in srgb,#ec4899 14%,transparent),transparent);background-attachment:fixed}
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:8px;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 75%,transparent)}
.pill{transition:transform .15s,box-shadow .15s}.pill:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.card,.day,.shopcard,.focus,.badges{border-radius:18px}
.coach{box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 40%,transparent)}
#fill{background:linear-gradient(90deg,var(--accent),#2fd0c4,#ffd84d)}
.shopcard{position:relative}
.shopcard[data-r=rare]{border-color:#3b82f6}
.shopcard[data-r=epic]{border-color:#a855f7;box-shadow:0 0 16px #a855f755}
.shopcard[data-r=legend]{border-color:#f5a524;box-shadow:0 0 20px #f5a52488}
.rar{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.shopcard[data-r=legend] .rar{color:#f5a524}.shopcard[data-r=epic] .rar{color:#a855f7}.shopcard[data-r=rare] .rar{color:#3b82f6}
</style>
</head>

<script>
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let state={tasks:{}};
DAYS.forEach(d=>state.tasks[d]=[]);
let docRef=null, saveTimer=null, loaded=false;
const LS_KEY="study-planner-v1";
const statusEl=document.getElementById("status");
function setStatus(t,ok){statusEl.textContent=t;statusEl.className="status"+(ok?" ok":"")}
function uid(){return Math.random().toString(36).slice(2,10)}

const SLOTS=[["morning","🌅 Morning","var(--m)"],["afternoon","☀️ Afternoon","var(--a)"],["evening","🌙 Evening","var(--e)"]];
const QUOTES=["Small steps still count as power-ups. Do one task right now!","Your limit isn’t where you stopped yesterday. Beat it by one page.","Tired is a signal, not a stop sign. Ten more minutes!","Strong minds are trained, not born. Hit the books!","Every checked box is a punch landed on laziness.","Don’t wait for motivation. Start, and it will catch up to you.","A tough subject is just a stronger opponent. Level up!","Rest is training too. Recharge, then come back stronger.","Future you is watching. Make them proud.","One problem at a time. That’s how mountains fall."];
const WIN="Every box checked! That’s a full power-up. Go rest like a champion! 🔥";
let qi=new Date().getDate()%QUOTES.length,allDone=false;
function showQuote(){document.getElementById("quote").textContent=allDone?WIN:"“"+QUOTES[qi]+"”"}
document.getElementById("newq").onclick=()=>{qi=(qi+1)%QUOTES.length;allDone=false;showQuote()};
function render(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  const todayName=DAYS[new Date().getDay()];
  let total=0,done=0;
  DAYS.forEach(day=>{
    const list=state.tasks[day]||[];
    list.forEach(t=>{if(!t.slot)t.slot="afternoon"});
    const dn=list.filter(t=>t.done).length;
    total+=list.length;done+=dn;
    const box=document.createElement("div");
    box.className="day"+(day===todayName?" today":"");
    const h=document.createElement("h2");
    h.textContent=day+(day===todayName?" · today":"");
    const sp=document.createElement("span");
    sp.textContent=list.length?dn+"/"+list.length:"empty";
    h.appendChild(sp);box.appendChild(h);
    SLOTS.forEach(([key,label,color])=>{
      const sec=document.createElement("div");
      sec.className="sec";sec.style.setProperty("--c",color);
      const h3=document.createElement("h3");h3.textContent=label;sec.appendChild(h3);
      const ul=document.createElement("ul");
      list.filter(t=>t.slot===key).forEach(t=>{
        const li=document.createElement("li");
        if(t.done)li.className="done";
        const cb=document.createElement("input");
        cb.type="checkbox";cb.checked=t.done;cb.id="c"+t.id;
        cb.onchange=()=>{t.done=cb.checked;if(cb.checked)onDone(t);changed()};
        const lb=document.createElement("label");lb.htmlFor=cb.id;lb.textContent=t.text;
        const x=document.createElement("button");x.textContent="×";x.title="Delete";
        x.onclick=()=>{state.tasks[day]=state.tasks[day].filter(z=>z.id!==t.id);changed()};
        const tg=document.createElement("span");
        const si=SUBJECTS.findIndex(z=>z[0]===t.subject);
        if(si>=0){tg.className="tag";tg.textContent=SUBJECTS[si][0];tg.style.background=SUBJECTS[si][1]}else{tg.className="tag none";tg.textContent="+tag"}
        tg.title="Click to change subject";
        tg.onclick=()=>{const n=si+1;t.subject=n<SUBJECTS.length?SUBJECTS[n][0]:"";changed()};
        const di=Math.max(0,DIFFS.findIndex(z=>z[0]===t.diff)),dg=document.createElement("span");
        dg.className="tag";dg.textContent=DIFFS[di][1][0];dg.style.background=DIFFS[di][2];dg.title=DIFFS[di][1]+" (click to change)";
        dg.onclick=()=>{t.diff=DIFFS[(di+1)%3][0];changed()};
        li.append(cb,lb,tg,dg,x);ul.appendChild(li);
      });
      sec.appendChild(ul);
      const add=document.createElement("div");add.className="add";
      const inp=document.createElement("input");inp.type="text";inp.placeholder="Add task…";inp.maxLength=120;
      const btn=document.createElement("button");btn.textContent="+";btn.title="Add";
      const go=()=>{const v=inp.value.trim();if(!v)return;state.tasks[day].push({id:uid(),text:v,done:false,slot:key,subject:curSubject,diff:curDiff});changed()};
      btn.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
      add.append(inp,btn);sec.appendChild(add);box.appendChild(sec);
    });
    grid.appendChild(box);
  });
  const pct=total?Math.round(done/total*100):0;
  document.getElementById("pct").textContent=pct+"%";
  document.getElementById("count").textContent=done+" of "+total+" tasks done this week";
  document.getElementById("fill").style.width=pct+"%";
  updatePower(done,pct);
  document.getElementById("sess").textContent="Sessions completed: "+(state.sessions||0);
  renderBadges();showTokens();showGoal();showExams();
  const nowDone=total>0&&done===total;
  if(nowDone!==allDone){allDone=nowDone;showQuote()}
}

function changed(){
  powerAnnounce=true;
  state.lastVisit=Date.now();
  render();
  checkBadges();
  checkLevel();
  if(!loaded)return;
  setStatus("Saving…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(save,400);
}
async function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}
  if(docRef){
    try{await docRef.set({state:JSON.stringify(state),updated:Date.now()});setStatus("Saved ✓",true);return}
    catch(e){setStatus("Saved on this device only")}
  }else{setStatus("Saved on this device only")}
}
function normalize(s){
  const out={tasks:{},lastVisit:(s&&s.lastVisit)||0,sessions:(s&&s.sessions)||0,log:(s&&s.log)||{},badges:(s&&s.badges)||[],doneTotal:(s&&s.doneTotal)||0,tokens:(s&&typeof s.tokens==="number")?s.tokens:50,shop:(s&&s.shop)||{owned:[],equip:{},acc:[]},goal:(s&&s.goal)||3,goalPaid:(s&&s.goalPaid)||"",today:(s&&s.today)||null,mute:!!(s&&s.mute),titleIdx:(s&&s.titleIdx!=null)?s.titleIdx:null,gm:(s&&s.gm)||{d:"",n:0},mm:(s&&s.mm)||{d:"",n:0},notes:(s&&s.notes)||{},exams:(s&&s.exams)||[],promo:(s&&s.promo)||[],tp:(s&&s.tp)||{d:"",n:0},ms:(s&&s.ms)||{d:"",n:0},hs:(s&&s.hs)||{d:"",n:0}};
  ["flash","grades","habits","subTime"].forEach(k=>{if(s&&s[k]!=null)out[k]=s[k]});
  DAYS.forEach(d=>{out.tasks[d]=(s&&s.tasks&&Array.isArray(s.tasks[d]))?s.tasks[d]:[]});
  return out;
}
document.getElementById("reset").onclick=()=>{
  DAYS.forEach(d=>state.tasks[d].forEach(t=>t.done=false));changed();
};

const SVGEL=document.querySelector(".coach svg"),AURA=SVGEL.querySelector(".aura");
const HAIR=[...SVGEL.querySelectorAll("polygon,path")].filter(e=>e.getAttribute("fill")==="#35d6c8");
const TIERS=[[0,"Warming up","#ffffff",.22,3,0,0],[25,"Fired up","#6ff0e4",.35,2.4,6,0],[50,"Super charged","#ffd84d",.45,1.9,10,0],[75,"Ultra mode","#ffb020",.55,1.4,14,1],[100,"LEGENDARY","#ff6bd6",.65,1,20,1]];
let powerAnnounce=false,lastTier=-1;
function updatePower(done,pct){
  let tier=0;
  TIERS.forEach((t,i)=>{if(pct>=t[0])tier=i});
  const [,label,color,op,dur,glow,gold]=TIERS[tier];
  AURA.setAttribute("fill",color);AURA.setAttribute("opacity",op);AURA.style.animationDuration=dur+"s";
  SVGEL.style.filter=glow?"drop-shadow(0 0 "+glow+"px "+color+")":"";
  applyLook(gold);
  document.getElementById("power").textContent="⚡ Power level "+(done*100)+" · "+label+" · "+xpInfo().title;
  if(powerAnnounce){
    powerAnnounce=false;
    if(lastTier>=0&&tier>lastTier)document.getElementById("quote").textContent="POWER UP! You reached "+label+"!";
  }
  lastTier=tier;
}
let fEnd=0,fTimer=null,fLeft=25*60;
const ftEl=document.getElementById("ftime"),fsBtn=document.getElementById("fstart"),flen=document.getElementById("flen");
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function fShow(){ftEl.textContent=fmt(fLeft);document.title=fTimer?fmt(fLeft)+" · Focus":"Weekly Study Planner"}
const SND={task:[[660,.09]],badge:[[523,.12],[659,.12],[784,.22]],done:[[880,.18],[1100,.18],[880,.3]],buy:[[988,.07],[1319,.15]],level:[[523,.1],[659,.1],[784,.1],[1047,.28]],bad:[[220,.25]],ok:[[784,.1]]};
let actx=null;
function beep(kind){
  if(state.mute)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;
    (SND[kind||"done"]||SND.done).forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d);t+=d});
  }catch(e){}
}
function fStop(){clearInterval(fTimer);fTimer=null;fsBtn.textContent="Start"}
function fTick(){
  fLeft=Math.max(0,Math.round((fEnd-Date.now())/1000));
  fShow();
  if(fLeft<=0){
    fStop();beep();fLeft=flen.value*60;fShow();
    document.getElementById("quote").textContent="Focus session complete! +1 session. Take a short break, then go again!";
    state.sessions=(state.sessions||0)+1;logStudy(+flen.value);earn(25);markToday();changed();
  }
}
fsBtn.onclick=()=>{
  if(fTimer){fStop();fShow();return}
  fEnd=Date.now()+fLeft*1000;fTimer=setInterval(fTick,500);fsBtn.textContent="Pause";
  document.getElementById("quote").textContent="Focus mode ON. Phone away, eyes on the book!";
  fTick();
};
document.getElementById("freset").onclick=()=>{fStop();fLeft=flen.value*60;fShow()};
flen.onchange=()=>{fStop();fLeft=flen.value*60;fShow()};
const SUBJECTS=[["Arabic","#10a37f"],["English","#3b82f6"],["History","#d97706"],["Programming","#8b5cf6"]];
let curSubject="";
function buildChips(){
  const box=document.getElementById("subjects");box.innerHTML="";

function showAway(ms){
  const h=Math.floor(ms/3600000);
  const list=Math.random()<0.5?NICE:ROAST;
  const msg=list[Math.floor(Math.random()*list.length)].replace("{h}",h);
  document.getElementById("awayhrs").textContent="You were away for "+h+" hours";
  document.getElementById("awaymsg").textContent=msg;

  document.getElementById("quote").textContent=msg;

async function init(){
  showQuote();render();
  let local=null;
  try{const r=localStorage.getItem(LS_KEY);if(r)local=JSON.parse(r)}catch(e){}
  try{
    const timeout=new Promise(res=>setTimeout(()=>res(null),10000));
    const boot=(async()=>{
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      if(!db||!user)return null;
      const id=await user.id();
      if(!id)return null;
      return db.doc("data/users/"+id+"/planner");
    })();
    docRef=await Promise.race([boot,timeout]);
  }catch(e){docRef=null}
  let loadedState=null;
  if(docRef){
    try{
      const snap=await docRef.get();
      if(snap.exists){loadedState=JSON.parse(snap.data().state)}
    }catch(e){}
  }
  const prev=Math.max((loadedState&&loadedState.lastVisit)||0,(local&&local.lastVisit)||0);
  state=normalize(loadedState||local||state);
  state.lastVisit=Date.now();
  loaded=true;
  render();
  if(prev&&Date.now()-prev>=AWAY_HOURS*3600000)showAway(Date.now()-prev);
  setStatus(docRef?"Saved ✓":"Saved on this device only",!!docRef);
  save();
}
document.addEventListener("visibilitychange",()=>{
  if(!loaded)return;
  const now=Date.now();
  if(document.visibilityState==="hidden"){state.lastVisit=now;save();}
  else if(now-(state.lastVisit||now)>=AWAY_HOURS*3600000){showAway(now-state.lastVisit);state.lastVisit=now;save();}
});
